<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Wing Preview</title>
<style>
  :root{--gold:#c9a227;--line:#332b26;--ink:#e8ded4;--dim:#8b7d72}
  html,body{margin:0;height:100%;background:#0d0b0a;overflow:hidden;font:12px ui-monospace,Menlo,monospace;color:var(--ink)}
  canvas{display:block;width:100%;height:100%}
  .panel{position:fixed;background:#14110fee;border:1px solid var(--line);border-radius:4px;padding:10px 12px}
  #ctl{left:12px;top:12px;width:250px}
  #hud{left:12px;bottom:12px;font-size:11px;color:var(--dim);line-height:1.7}
  h3{margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .seg{display:flex;gap:2px;margin-bottom:8px}
  .seg button{flex:1;padding:5px 0;font-size:11px}
  button{background:#241f1c;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:5px 9px;cursor:pointer;font:inherit;font-size:11px}
  button:hover{border-color:var(--gold)}
  button.on{background:var(--gold);color:#1a1512;border-color:var(--gold);font-weight:700}
  textarea,select,input{width:100%;background:#241f1c;border:1px solid var(--line);color:var(--ink);
    padding:5px 7px;border-radius:3px;font:inherit;font-size:11px;resize:vertical}
  label{display:block;font-size:10px;color:var(--dim);margin:8px 0 3px;letter-spacing:.06em;text-transform:uppercase}
  #status{margin-top:7px;font-size:10px;line-height:1.5;min-height:14px}
  .keys{color:var(--dim)}
  .keys b{color:var(--ink)}
  #err{position:fixed;inset:24px;background:#1a0f0d;border:1px solid #5c2e2e;color:#e08b7a;padding:14px;
    border-radius:4px;display:none;white-space:pre-wrap;overflow:auto;font-size:11px}
</style></head>
<body>
<canvas id="c"></canvas>

<div class="panel" id="ctl">
  <h3>View</h3>
  <div class="seg">
    <button id="mPlayer" class="on">Player</button>
    <button id="mOrbit">Overview</button>
  </div>
  <div class="seg">
    <button id="reroll">Reroll seed</button>
    <button id="lights">Lights</button>
  </div>
  <div class="seg">
    <button id="kit">Kit: off</button>
    <button id="roof">Roof: off</button>
    <button id="fx">FX: off</button>
    <span id="fps" style="flex:1;text-align:right;padding:5px 4px;color:var(--dim)">– fps</span>
  </div>
  <div id="rstats" style="font-size:10px;color:var(--dim);margin-top:2px">
  </div>

  <h3 style="margin-top:12px">Retexture</h3>
  <label>Surface</label>
  <select id="target"></select>
  <label>Prompt</label>
  <textarea id="prompt" rows="3" placeholder="cracked obsidian slabs with veins of cooling magma"></textarea>
  <button id="gen" style="width:100%;margin-top:6px" class="on">Generate &amp; Apply</button>
  <div id="status"></div>
</div>

<div class="panel" id="hud">loading…</div>
<div id="err"></div>

<script type="module">
// Uses the game's own SceneManager rather than a hand-rolled renderer. An
// earlier version built its own lights, which flattened the dungeon into a
// lit floorplan — the atmosphere here comes from torches, fog, bloom and SSAO,
// so replacing them with editor fill lights destroys exactly what you're
// trying to judge.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SceneManager } from '/src/rendering/SceneManager.js';
import { DungeonEnvironment } from '/src/rendering/DungeonEnvironment.js';
import { KitAssembler } from '/src/rendering/env/KitAssembler.js';
import { validateBiome } from '/src/rendering/env/KitSchema.js';

const errBox = document.getElementById('err');
const fail = (e) => { errBox.style.display = 'block'; errBox.textContent = String(e?.stack || e); };
window.addEventListener('error', ev => fail(ev.error || ev.message));

const params = new URLSearchParams(location.search);
let seed = params.get('seed') || '12345';
const roomType = params.get('roomType') || 'combat';
const roomIndex = Number(params.get('roomIndex') || 2);
const themeId = params.get('themeId') || 'crucible_below';

const canvas = document.getElementById('c');
const sm = new SceneManager(canvas);
await sm.init({});
const scene = sm.scene, camera = sm.getCamera();

const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true; orbit.enabled = false;

let env = null, theme = null, wing = null, mode = 'player';
let yaw = 0, pitch = -0.28, pos = new THREE.Vector3();
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); if (e.key === ' ') e.preventDefault(); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
canvas.addEventListener('mousedown', () => { if (mode === 'player') canvas.requestPointerLock?.(); });
addEventListener('mousemove', e => {
  if (mode !== 'player' || document.pointerLockElement !== canvas) return;
  yaw -= e.movementX * 0.0024;
  pitch = Math.max(-1.2, Math.min(0.6, pitch - e.movementY * 0.0024));
});

async function load() {
  document.getElementById('hud').textContent = 'building wing…';
  if (env) env.dispose();
  const [w, t] = await Promise.all([
    fetch(`/api/preview-wing?roomType=${roomType}&seed=${seed}&roomIndex=${roomIndex}`).then(r => r.json()),
    fetch(`/api/dungeon-theme?themeId=${themeId}`).then(r => r.json()).catch(() => null),
  ]);
  if (w.error) throw new Error(w.error);
  wing = w; theme = (t && !t.error) ? t : null;

  // The dungeon's real look — dark ambient, torch colour, fog, bloom strength.
  if (theme?.atmosphere) sm.applyDungeonAtmosphere(theme.atmosphere);

  // Exposed for the headless diagnostics probe.
  window.__scene = scene; window.__camera = camera; window.__THREE = THREE;
  env = new DungeonEnvironment(scene, sm.renderer, camera);
  env.buildWing({ wing, roomType, theme, roomIndex });

  // Open on the main chamber, framed like the game's third-person camera —
  // back and above, angled down. Sitting exactly on playerSpawn put the camera
  // inside the entry chamber's wall, which is why the first frame was a
  // close-up of a texture.
  const main = wing.chambers.find(c => c.template === wing.mainTemplate) || wing.chambers[0];
  // Match CameraController.enterDungeonCamera() exactly — distance 28, pitch
  // -0.95, target locked to y=1. Evaluating the environment from any other
  // angle is evaluating a view the game never shows: top-down IS the gameplay,
  // so it is the only framing worth judging the art on.
  pos.set(main.cx, 1, main.cz);   // `pos` is now the ground target, not the eye
  yaw = 0;

  const surf = document.getElementById('target');
  surf.innerHTML = '';
  for (const [label, id] of [
    ['floor — ' + (theme?.floor?.primary ?? 'floor_stone'), theme?.floor?.primary ?? 'floor_stone'],
    ['wall — ' + (theme?.wall?.primary ?? 'wall_stone'), theme?.wall?.primary ?? 'wall_stone'],
  ]) {
    const o = document.createElement('option'); o.value = id; o.textContent = label; surf.appendChild(o);
  }

  const hz = (wing.features || []).filter(f => f.isHazard);
  document.getElementById('hud').innerHTML =
    `<b style="color:#c9a227">${wing.mainTemplate}</b> · seed ${seed} · ${roomType}<br>`
    + `${wing.chambers.length} chambers · ${(wing.features || []).length} features`
    + (hz.length ? ` · <span style="color:#d24a30">${hz.length} hazards</span>` : '')
    + `<br><span class="keys"><b>WASD</b> walk · <b>Shift</b> fast · drag to turn — game camera (dist 28, pitch -0.95)</span>`;
}

document.getElementById('mPlayer').onclick = () => setMode('player');
document.getElementById('mOrbit').onclick = () => setMode('orbit');
function setMode(m) {
  mode = m;
  document.getElementById('mPlayer').classList.toggle('on', m === 'player');
  document.getElementById('mOrbit').classList.toggle('on', m === 'orbit');
  orbit.enabled = m === 'orbit';
  if (m === 'orbit') {
    document.exitPointerLock?.();
    const box = new THREE.Box3().setFromObject(scene);
    const size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
    const span = Math.max(size.x, size.z) || 200;
    camera.position.set(mid.x, span * 0.8, mid.z + span * 0.8);
    orbit.target.set(mid.x, 0, mid.z); orbit.update();
  }
}
document.getElementById('reroll').onclick = async () => {
  seed = String(Math.floor(Math.random() * 100000));
  try { await load(); setMode(mode); } catch (e) { fail(e); }
};
// applyDungeonAtmosphere turns bloom, SSAO and shadows off with the comment
// "at 10fps ... can't afford". That measurement predates characters dropping
// from 1.42M to 150K triangles. Rather than assert it's affordable now, this
// toggles them on your actual GPU and shows the frame cost.
// Enclosure test. The wing has no ceiling because the overhead camera has to
// see the player; this builds one and fades it as the camera rises through it,
// so the same scene can feel roofed at eye level and stay readable from above.
// Kit build. Replaces the greybox floor plane and box walls with placed kit
// geometry from the biome spec. Pieces with no GLB yet fall back to sized
// blocks, so this is inspectable before a kit has been generated.
let kitOn = false, assembler = null, biome = null;
document.getElementById('kit').onclick = async (e) => {
  kitOn = !kitOn;
  e.target.textContent = `Kit: ${kitOn ? 'on' : 'off'}`;
  e.target.classList.toggle('on', kitOn);
  if (!kitOn) {
    assembler?.dispose(); assembler = null;
    env.group.visible = true;
    if (sm._ambientLight?.userData._kitSaved != null) {
      sm._ambientLight.intensity = sm._ambientLight.userData._kitSaved;
    }
    return;
  }
  try {
    if (!biome) {
      biome = (await import('/content/biomes/crucible_below.mjs')).default;
      const errs = validateBiome(biome);
      if (errs.length) throw new Error(errs.join('; '));
    }
    // Hide the greybox so the two constructions aren't drawn on top of
    // each other — the comparison is the point.
    env.group.visible = false;
    // Drop ambient hard while the kit is shown. Light pools only read as pools
    // if the space between them is genuinely dark — with the atmosphere's
    // ambient still up they wash out and the scene goes flat again, which is
    // the thing they exist to fix.
    if (sm._ambientLight) {
      sm._ambientLight.userData._kitSaved ??= sm._ambientLight.intensity;
      // Low, not zero. At 0.06 the scene measured 93% near-black — pools have
      // nothing to sit against and the room reads as a void rather than as a
      // dark room. A dim floor keeps shape legible between them.
      sm._ambientLight.intensity = 0.35;
    }
    assembler = new KitAssembler(scene, biome);
    let pieces = 0;
    for (const ch of wing.chambers) {
      pieces += await assembler.buildChamber(ch, (wing.doors || []).filter(d =>
        Math.abs(d.cx - ch.cx) < ch.halfX + 6 && Math.abs(d.cz - ch.cz) < ch.halfZ + 6));
    }
    document.getElementById('status').style.color = '#8fd6a0';
    document.getElementById('status').textContent = `kit built · ${pieces} piece types instanced`;
  } catch (err) {
    document.getElementById('status').style.color = '#e08b7a';
    document.getElementById('status').textContent = 'kit: ' + err.message;
    kitOn = false; e.target.textContent = 'Kit: off'; e.target.classList.remove('on');
    env.group.visible = true;
  }
};

let roofOn = false, roofH = 13;
document.getElementById('roof').onclick = (e) => {
  roofOn = !roofOn;
  if (roofOn && wing) env.buildCeiling(wing.bounds, roofH);
  else if (env?._ceiling) { env.group.remove(env._ceiling); env._ceiling = null; }
  e.target.textContent = `Roof: ${roofOn ? 'on' : 'off'}`;
  e.target.classList.toggle('on', roofOn);
};

let fxOn = false;
document.getElementById('fx').onclick = (e) => {
  fxOn = !fxOn;
  if (sm._bloomPass) sm._bloomPass.enabled = fxOn;
  if (sm._ssaoPass) sm._ssaoPass.enabled = fxOn;
  if (sm.renderer?.shadowMap) {
    sm.renderer.shadowMap.enabled = fxOn;
    sm.renderer.shadowMap.needsUpdate = true;
  }
  sm.useComposer = true;
  scene.traverse(o => { if (o.isMesh || o.isSkinnedMesh) { o.castShadow = fxOn; o.receiveShadow = fxOn; } });
  e.target.textContent = `FX: ${fxOn ? 'on' : 'off'}`;
  e.target.classList.toggle('on', fxOn);
};

let boosted = false;
const boost = new THREE.AmbientLight(0xffffff, 1.6);
document.getElementById('lights').onclick = (e) => {
  boosted = !boosted;
  if (boosted) scene.add(boost); else scene.remove(boost);
  e.target.classList.toggle('on', boosted);
};

document.getElementById('gen').onclick = async () => {
  const st = document.getElementById('status');
  const prompt = document.getElementById('prompt').value.trim();
  const texId = document.getElementById('target').value;
  if (!prompt) { st.style.color = '#e08b7a'; st.textContent = 'describe the surface first'; return; }
  st.style.color = '#8b7d72'; st.textContent = `generating ${texId}… ~20s, costs ~$0.04`;
  try {
    const r = await fetch('/api/retexture', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, texId }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    st.style.color = '#8fd6a0'; st.textContent = `applied — rebuilding…`;
    await load(); setMode(mode);
    st.textContent = `${texId} updated ($${j.spent.toFixed(2)})`;
  } catch (e) {
    st.style.color = '#e08b7a'; st.textContent = e.message;
  }
};

// EffectComposer renders several passes and info resets on each, so reading
// after render() reports the final fullscreen quad — 1 call, 2 triangles.
// Manual reset accumulates every pass in the frame instead.
sm.renderer.info.autoReset = false;

addEventListener('resize', () => sm.resize());
try { await load(); } catch (e) { fail(e); }

let t = 0, last = performance.now(), fCount = 0, fLast = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
  t += dt;
  if (mode === 'player') {
    // WASD walks the target across the floor like the player; the camera stays
    // on the game's fixed arm above and behind it.
    const sp = (keys.has('shift') ? 60 : 22) * dt;
    const fwd = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    if (keys.has('w')) pos.addScaledVector(fwd, -sp);
    if (keys.has('s')) pos.addScaledVector(fwd, sp);
    if (keys.has('a')) pos.addScaledVector(right, -sp);
    if (keys.has('d')) pos.addScaledVector(right, sp);
    pos.y = 1;
    const DIST = 28, PITCH = -0.95;   // CameraController dungeon values
    const cp = Math.cos(PITCH);
    camera.position.set(
      pos.x - DIST * cp * Math.sin(yaw),
      pos.y + DIST * Math.sin(-PITCH),
      pos.z - DIST * cp * Math.cos(yaw),
    );
    camera.lookAt(pos);
  } else orbit.update();
  try {
    sm.tickDungeonAtmosphere?.(t);
    env?.tick?.(t);
    env?.setCeilingVisibility?.(camera.position.y);
    assembler?.tick?.(t);          // light-pool flicker
  } catch {}
  sm.renderer.info.reset();
  sm.render();
  if (++fCount >= 30) {
    const fps = 1000 * fCount / (now - fLast);
    document.getElementById('fps').textContent = `${fps.toFixed(0)} fps`;
    // fps alone can't tell you *why* a frame is slow. Draw calls and triangles
    // separate "too much geometry" from "too many separate objects" — the
    // second is what instancing fixes and the first is what decimation fixes.
    const i = sm.renderer.info.render;
    document.getElementById('rstats').textContent =
      `${i.calls} draw calls · ${(i.triangles / 1000).toFixed(0)}K tris`;
    fCount = 0; fLast = now;
  }
}
frame();
</script></body></html>
